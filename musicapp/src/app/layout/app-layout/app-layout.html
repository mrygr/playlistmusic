<div class="app-layout" [class.collapsed]="isSidebarCollapsed">
  
<aside class="sidebar">
    <button class="collapse-btn" (click)="toggleSidebar()" [title]="isSidebarCollapsed ? 'Expandir' : 'Ocultar'">
      <span class="icon">{{ isSidebarCollapsed ? '☰' : '◀' }}</span>
    </button>

    <div class="user-profile" [title]="isSidebarCollapsed ? username : ''">
      <div class="avatar">
        <img src="https://ui-avatars.com/api/?name={{username}}&background=1db954&color=fff" alt="User">
      </div>
      <span class="username">{{ username }}</span>
    </div>

    <nav class="nav-menu">
      <div class="nav-item" routerLink="/home" [title]="isSidebarCollapsed ? 'Inicio' : ''">
        <span class="icon">🏠</span>
        <span class="text">Inicio</span>
      </div>

      <div class="nav-item" routerLink="/playlist/all" routerLinkActive="active" [title]="isSidebarCollapsed ? 'Mis Playlists' : ''">
        <span class="icon">📚</span>
        <span class="text">Mis Playlists</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="cerrarSesion()" [title]="isSidebarCollapsed ? 'Cerrar Sesión' : ''">
        <span class="icon">🚪</span>
        <span class="text">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

<header class="topbar">
    <div class="search-container">
      <input type="text" placeholder="Buscar canciones, artistas...">
      <span class="search-icon">🔍</span> 
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

<footer class="player">
    <div class="player-info">
      <div class="song-image"></div>
      <div class="song-details">
        <p class="song-title">Nombre de la canción</p>
        <p class="song-artist">Artista desconocido</p>
      </div>
    </div>
    
    <div class="player-controls">
      <span class="ctrl-btn">⏮</span>
      <span class="play-btn">▶</span>
      <span class="ctrl-btn">⏭</span>
    </div>
    
    <div class="player-actions">
      <button class="queue-btn">🎧 Fila</button>
    </div>
  </footer>

  <div class="modal-overlay" *ngIf="showCreateModal">
    <div class="modal-content">
      <h2>Crear Nueva Playlist</h2>
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" placeholder="Ej. Favoritas del mes" (input)="newPlaylistName = $any($event.target).value">
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea placeholder="Opcional" (input)="newPlaylistDesc = $any($event.target).value"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" (click)="closeModal()">Cancelar</button>
        <button class="btn-create" (click)="crearPlaylist()">Crear</button>
      </div>
    </div>
  </div>

</div>
