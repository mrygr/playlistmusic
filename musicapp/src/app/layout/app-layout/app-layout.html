<div class="app-layout" [class.collapsed]="isSidebarCollapsed">
  
  <aside class="sidebar">
    <button class="collapse-btn" (click)="toggleSidebar()" [title]="isSidebarCollapsed ? 'Expandir' : 'Ocultar'">
      <span class="icon" *ngIf="!isSidebarCollapsed">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <path d="M15 15l-3-3 3-3"></path>
        </svg>
      </span>
      <span class="icon" *ngIf="isSidebarCollapsed">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </span>
    </button>

    <div class="user-profile" [title]="isSidebarCollapsed ? username : ''">
      <div class="avatar">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Usuario">
      </div>
      <span class="username">{{ username }}</span>
    </div>

    <div class="user-divider"></div>

    <nav class="nav-menu">
      <div class="nav-item" routerLink="/home" routerLinkActive="active" [title]="isSidebarCollapsed ? 'Inicio' : ''" (click)=" playerService.closeExpandedView()">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </span>
        <span class="text">Inicio</span>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-item" routerLink="/playlist/all" routerLinkActive="active" [title]="isSidebarCollapsed ? 'Mis Playlists' : ''" (click)=" playerService.closeExpandedView()">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </span>
        <span class="text">Mis Playlists</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="cerrarSesion()" [title]="isSidebarCollapsed ? 'Cerrar Sesión' : ''">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </span>
        <span class="text">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <header class="topbar">
    <div class="search-wrapper">
      <input type="text" placeholder="Buscar canciones, artistas..." class="search-input">
      <button class="search-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <app-player class="player"></app-player>

  <div class="global-menu-overlay" *ngIf="playlistService.globalMenuSignal() as menuState" (click)="closeGlobalMenu()">
    
    <div class="context-menu-wrapper" 
         [style.top]="menuState.top" 
         [style.bottom]="menuState.bottom" 
         [style.left]="menuState.left" 
         [style.right]="menuState.right" 
         [ngClass]="[menuState.verticalPos, menuState.horizontalPos]"
         (click)="$event.stopPropagation()">
      
      <div class="arrow-pointer"></div>

      <div class="context-menu-container">
        <div class="slider-track" [class.slide-to-playlists]="menuView === 'playlists'">
          
          <div class="menu-pane pane-main">
            <button class="menu-action" (click)="showPlaylistsMenu($event)">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </span>
              <span class="action-text">Agregar a playlist</span>
            </button>
            <button class="menu-action" (click)="$event.stopPropagation()">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
              </span>
              <span class="action-text">Compartir canción</span>
            </button>
            <button class="menu-action" (click)="$event.stopPropagation()">
              <span class="action-icon">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              </span>
              <span class="action-text">Ver información</span>
            </button>
          </div>

          <div class="menu-pane pane-playlists">
            <div class="pane-header">
              <button class="btn-back" (click)="goBackInMenu($event)">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span class="back-text">Regresar</span>
              </button>
            </div>
            
            <div class="playlists-list">
              <button class="menu-action create-btn" *ngIf="menuState.allowCreate" (click)="openCreateModalFromMenu($event)">
                <span class="action-icon" style="color: #1db954;">
                  <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </span>
                <span class="action-text" style="color: #1db954;">Crear nueva playlist</span>
              </button>
              <div class="menu-divider" *ngIf="menuState.allowCreate"></div>

              <button class="menu-action list-item" *ngFor="let playlist of availablePlaylists" (click)="addSongToPlaylist(playlist, $event)">
                <img [src]="playlist.cover" class="menu-playlist-mini-cover" alt="">
                <span class="action-text">{{ playlist.name }}</span>
              </button>
              
              <div *ngIf="availablePlaylists.length === 0" class="empty-msg">No hay playlists disponibles.</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" *ngIf="playlistService.globalModalSignal().show" (click)="closeGlobalModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <h3>{{ playlistService.globalModalSignal().initialSong ? 'Crear Playlist y Agregar Canción' : 'Crear nueva Playlist' }}</h3>
      
      <label class="modal-label">Nombre <span class="required-mark">*</span></label>
      <input type="text" [(ngModel)]="newPlaylistName" placeholder="Nombre de la playlist" class="modal-input" (keyup.enter)="confirmGlobalCreate()">
      
      <label class="modal-label">Descripción <span class="optional-mark">(Opcional)</span></label>
      <textarea [(ngModel)]="newPlaylistDesc" placeholder="Añade una descripción..." class="modal-textarea" rows="3"></textarea>
      
      <div class="modal-actions">
        <button class="btn-cancel" (click)="closeGlobalModal()">Cancelar</button>
        <button class="btn-confirm" (click)="confirmGlobalCreate()">{{ playlistService.globalModalSignal().initialSong ? 'Crear y Agregar' : 'Crear' }}</button>
      </div>
    </div>
  </div>
</div>
