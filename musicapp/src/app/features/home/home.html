<div class="home-container">
  <h2 class="section-title">Recomendados</h2>
  
  <div class="grid-layout">
    <div class="song-card" *ngFor="let song of recommendedSongs" [class.active-menu]="playlistService.globalMenuSignal()?.song?.id === song.id">
      <div class="cover-wrapper">
        <img [src]="song.cover" [alt]="song.title" class="cover-img">
        
        <div class="hover-actions">
          <button class="btn-play" (click)="playSong(song, $event)">▶</button>
          <button class="btn-dots" (click)="playlistService.openGlobalSongMenu(song, $event, true)">⋮</button>
        </div>
      </div>

      <div class="song-details">
        <h3 class="song-title" [title]="song.title">{{ song.title }}</h3>
        <p class="song-artist" [title]="song.artist">{{ song.artist }}</p>
      </div>
    </div>
  </div>
</div>
