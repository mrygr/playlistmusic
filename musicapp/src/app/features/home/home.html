<div class="home-container">
  <h2 class="section-title">Recomendados</h2>
  
  <div class="grid-layout">
    <div class="song-card" *ngFor="let song of recommendedSongs" (mouseleave)="closeMenu()">
      
      <div class="cover-wrapper">
        <img [src]="song.cover" [alt]="song.title" class="cover-img">
        
        <div class="hover-actions" [class.force-visible]="activeMenuSongId === song.id">
          <button class="btn-play" (click)="playSong(song, $event)">▶</button>
          <button class="btn-dots" (click)="toggleContextMenu(song.id, $event)">⋮</button>
        </div>

        <div class="context-menu-container" *ngIf="activeMenuSongId === song.id">
          <div class="slider-track" [class.slide-to-playlists]="menuView === 'playlists'">
            
            <div class="menu-pane">
              <button class="menu-action" (click)="showPlaylistsMenu($event)">
                Agregar a playlist 
                <span class="arrow">▶</span>
              </button>
            </div>

            <div class="menu-pane">
              <div class="pane-header">
                <button class="btn-back" (click)="goBackInMenu($event)">◀</button>
                <span>Guardar en...</span>
              </div>
              <div class="playlists-list">
                <button class="menu-action" *ngFor="let playlist of userPlaylists" (click)="addToPlaylist(playlist, $event)">
                  {{ playlist }}
                </button>
              </div>
            </div>

          </div>
        </div>

      </div>

      <div class="song-details">
        <h3 class="song-title" [title]="song.title">{{ song.title }}</h3>
        <p class="song-artist" [title]="song.artist">{{ song.artist }}</p>
      </div>

    </div>
  </div>
</div>
